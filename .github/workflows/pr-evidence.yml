name: PR evidence

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  disclosure:
    name: PR disclosure
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The PR cannot replace the validator that evaluates its disclosure.
      # No pull_request_target, PR-head execution, write token or secrets.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - name: Check disclosure structure, not the truth of test claims
        run: python scripts/governance.py pr "$GITHUB_EVENT_PATH"
