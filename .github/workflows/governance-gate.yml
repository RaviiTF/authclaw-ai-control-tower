name: Governance Gate

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted, edited, dismissed]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: governance-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gate:
    name: Governance Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Only reviewed base code/configuration executes, including on review events.
      # PR head Git objects are fetched as data; no head checkout or execution.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - name: Validate disclosure, Git growth and actual current-head approval
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/governance_gate.py --event "$GITHUB_EVENT_PATH" --fetch
